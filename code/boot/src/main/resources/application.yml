spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: climbing
    secret: ${SECRET}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
        hibernate:
          default_schema: ${SPRING_DATASOURCE_USERNAME}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${SPRING_DATASOURCE_USERNAME}
    default-schema: ${SPRING_DATASOURCE_USERNAME}
server:
  port: 8080
