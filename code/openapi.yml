openapi: "3.1.0"
info:
  title: Climbing App API
  description: API for the Climbing Gym Boulder Creator app
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Authentication and user registration
  - name: Users
    description: User management
  - name: Gyms
    description: Gym management
  - name: Wall Images
    description: Wall image upload and retrieval
  - name: Boulders
    description: Boulder creation and viewing
  - name: Competitions
    description: Competitions, registrations and competition boulders

paths:
  /api/auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: User account is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Logout (revoke a refresh token)
      description: Revokes the presented refresh token. Idempotent — always returns 204, even if the token is already invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh token revoked
  /api/auth/logout-all:
    post:
      operationId: authLogoutAll
      tags: [Auth]
      summary: Logout from all devices
      description: Revokes every refresh token family belonging to the authenticated user.
      responses:
        '204':
          description: All sessions revoked
        '401':
          description: Missing or invalid access token
      security:
        - bearerAuth: []
  /api/auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
  /api/auth/oauth/google:
    post:
      operationId: authOauthGoogle
      tags: [Auth]
      summary: Sign in with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid Google token
  /api/auth/oauth/apple:
    post:
      operationId: authOauthApple
      tags: [Auth]
      summary: Sign in with Apple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid Apple token
  /api/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get the logged-in user with their per-gym roles
      description: Use it on app start and after a role change to decide which controls to show.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/users/deactivated:
    get:
      operationId: getDeactivated
      tags: [Users]
      summary: Get all deactivated users
      responses:
        '200':
          description: List of deactivated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivatedUsersResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/users/activate-users:
    post:
      operationId: activateUsers
      tags: [Users]
      summary: Activate users by their IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        '200':
          description: Users activated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/gyms:
    get:
      operationId: listGyms
      tags: [Gyms]
      summary: List all gyms
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of gyms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymPageResponse'
      security:
        - bearerAuth: []
    post:
      operationId: createGym
      tags: [Gyms]
      summary: Create a new gym (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGymRequest'
      responses:
        '201':
          description: Gym created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDto'
        '403':
          description: Forbidden - admin only
      security:
        - bearerAuth: []
  /api/gyms/{gymId}:
    get:
      operationId: getGymById
      tags: [Gyms]
      summary: Get gym by ID
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gym details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDto'
        '404':
          description: Gym not found
      security:
        - bearerAuth: []
    put:
      operationId: updateGym
      tags: [Gyms]
      summary: Update gym, including its logo (admin or gym owner)
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGymRequest'
      responses:
        '200':
          description: Gym updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDto'
        '403':
          description: Forbidden
        '404':
          description: Gym not found
      security:
        - bearerAuth: []
    delete:
      operationId: deleteGym
      tags: [Gyms]
      summary: Delete gym (admin)
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Gym deleted
        '403':
          description: Forbidden
        '404':
          description: Gym not found
      security:
        - bearerAuth: []
  /api/gyms/{gymId}/staff:
    get:
      operationId: listGymStaff
      tags: [Gyms]
      summary: List the owners and setters of a gym (admin or gym owner)
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gym staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymStaffDto'
        '403':
          description: Forbidden - admin or gym owner only
        '404':
          description: Gym not found
      security:
        - bearerAuth: []
    post:
      operationId: addGymStaff
      tags: [Gyms]
      summary: Add a user to the gym staff, or change their role (admin or gym owner)
      description: >-
        Gym owners can only add or change SETTERs. Only an admin can grant, change or remove
        the OWNER role.
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGymStaffRequest'
      responses:
        '200':
          description: Staff member added or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymStaffDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Gym or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/gyms/{gymId}/staff/{userId}:
    delete:
      operationId: removeGymStaff
      tags: [Gyms]
      summary: Remove a user from the gym staff (admin or gym owner; only admins remove owners)
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Staff member removed
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The user is not staff of this gym
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/gyms/{gymId}/wall-images:
    get:
      operationId: listWallImages
      tags: [Wall Images]
      summary: List wall images for a gym
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of wall image summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WallImagePageResponse'
      security:
        - bearerAuth: []
    post:
      operationId: uploadWallImage
      tags: [Wall Images]
      summary: Upload a wall image (admin or gym staff)
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WallImageUploadRequest'
      responses:
        '201':
          description: Image uploaded successfully
        '400':
          description: Invalid file
        '403':
          description: Forbidden
      security:
        - bearerAuth: []
  /api/wall-images/{wallImageId}:
    get:
      operationId: getWallImageById
      tags: [Wall Images]
      summary: Get wall image metadata
      parameters:
        - name: wallImageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Wall image metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WallImageDetail'
        '404':
          description: Wall image not found
      security:
        - bearerAuth: []
    put:
      operationId: updateWallImage
      tags: [Wall Images]
      summary: Update a wall image (name and, optionally, the photo)
      parameters:
        - name: wallImageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WallImageUpdateRequest'
      responses:
        '204':
          description: Wall image updated
        '400':
          description: Invalid file
        '403':
          description: Forbidden
        '404':
          description: Wall image not found
      security:
        - bearerAuth: []
    delete:
      operationId: deleteWallImage
      tags: [Wall Images]
      summary: Delete a wall image
      parameters:
        - name: wallImageId
          in: path
          required: true
          schema:
            type: integer
        - name: gymId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Wall image deleted
        '403':
          description: Forbidden
        '404':
          description: Wall image not found
        '409':
          description: The wall image still has boulders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/wall-images/{wallImageId}/data:
    get:
      operationId: getWallImageData
      tags: [Wall Images]
      summary: Download full wall image
      parameters:
        - name: wallImageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Wall image binary data
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Wall image not found
      security:
        - bearerAuth: []
  /api/wall-images/{wallImageId}/thumbnail:
    get:
      operationId: getWallImageThumbnail
      tags: [Wall Images]
      summary: Download wall image thumbnail
      parameters:
        - name: wallImageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thumbnail binary data
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Wall image not found
      security:
        - bearerAuth: []
  /api/gyms/{gymId}/boulders:
    get:
      operationId: listBoulders
      tags: [Boulders]
      summary: List boulders for a gym
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of boulders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoulderPageResponse'
      security:
        - bearerAuth: []
    post:
      operationId: createBoulder
      tags: [Boulders]
      summary: Create a boulder with inline holds
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoulderRequest'
      responses:
        '201':
          description: Boulder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoulderDto'
        '400':
          description: Invalid input
      security:
        - bearerAuth: []
  /api/wall-images/{wallImageId}/boulders:
    get:
      operationId: listBouldersByWall
      tags: [Boulders]
      summary: List boulders for a wall image
      parameters:
        - name: wallImageId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of boulders on the wall image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoulderWithUserPageResponse'
      security:
        - bearerAuth: []
  /api/boulders/{boulderId}:
    get:
      operationId: getBoulderById
      tags: [Boulders]
      summary: Get boulder detail with holds
      parameters:
        - name: boulderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Boulder details with holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoulderDetailDto'
        '404':
          description: Boulder not found
      security:
        - bearerAuth: []
    put:
      operationId: updateBoulder
      tags: [Boulders]
      summary: Update boulder (creator, gym staff or admin)
      parameters:
        - name: boulderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoulderRequest'
      responses:
        '200':
          description: Boulder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoulderDto'
        '403':
          description: Forbidden - not the creator
        '404':
          description: Boulder not found
        '409':
          description: Competition boulders must be managed through the competition endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      operationId: deleteBoulder
      tags: [Boulders]
      summary: Delete boulder (creator, gym staff or admin)
      parameters:
        - name: boulderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Boulder deleted
        '403':
          description: Forbidden
        '404':
          description: Boulder not found
        '409':
          description: Competition boulders must be managed through the competition endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/gyms/{gymId}/competitions:
    post:
      operationId: createCompetition
      tags: [Competitions]
      summary: Create a competition for a gym (admin or gym staff)
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionRequest'
      responses:
        '201':
          description: Competition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionDto'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin or gym owner only
        '404':
          description: Gym not found
      security:
        - bearerAuth: []
  /api/gyms/{gymId}/competitions/active:
    get:
      operationId: listActiveCompetitions
      tags: [Competitions]
      summary: Upcoming and running competitions of a gym
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Competitions that have not ended yet or ended less than 12 hours ago
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionAnnouncementDto'
      security:
        - bearerAuth: []
  /api/competitions/{competitionId}:
    put:
      operationId: updateCompetition
      tags: [Competitions]
      summary: Replace a competition before it starts (admin or gym staff)
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionRequest'
      responses:
        '200':
          description: Competition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionDto'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin or gym owner only
        '404':
          description: Competition not found
        '409':
          description: The competition has already started, or its type can't change because it has boulders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/competitions/{competitionId}/registration:
    post:
      operationId: registerForCompetition
      tags: [Competitions]
      summary: Register the current user for a competition (before it starts)
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionRegistrationRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionParticipantDto'
        '400':
          description: Invalid input or the user has no gender set in their profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Competition not found
        '409':
          description: Already registered or the competition has already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      operationId: unregisterFromCompetition
      tags: [Competitions]
      summary: Unregister the current user from a competition (before it starts)
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User unregistered
        '404':
          description: Competition not found or the user is not registered
        '409':
          description: The competition has already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/competitions/{competitionId}/boulders:
    get:
      operationId: listCompetitionBoulders
      tags: [Competitions]
      summary: All boulders of a competition with their holds
      description: >-
        Only available from the start of the competition until 24 hours after it ends.
        Admins and gym staff (owners and setters) can see them at any time.
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Competition boulders with holds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionBoulderDto'
        '403':
          description: The competition has not started yet or its boulders are no longer available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Competition not found
      security:
        - bearerAuth: []
    post:
      operationId: createCompetitionBoulder
      tags: [Competitions]
      summary: Create a competition boulder before it starts (admin or gym staff)
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionBoulderRequest'
      responses:
        '201':
          description: Boulder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionBoulderDto'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin or gym owner only
        '404':
          description: Competition not found
        '409':
          description: The competition has already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/competitions/{competitionId}/boulders/{boulderId}:
    put:
      operationId: updateCompetitionBoulder
      tags: [Competitions]
      summary: Replace a competition boulder and its holds before it starts (admin or gym staff)
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
        - name: boulderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionBoulderRequest'
      responses:
        '200':
          description: Boulder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionBoulderDto'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - admin or gym owner only
        '404':
          description: Competition or boulder not found
        '409':
          description: The competition has already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      operationId: deleteCompetitionBoulder
      tags: [Competitions]
      summary: Delete a competition boulder before it starts (admin or gym staff)
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
        - name: boulderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Boulder deleted
        '403':
          description: Forbidden - admin or gym owner only
        '404':
          description: Competition or boulder not found
        '409':
          description: The competition has already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/competitions/{competitionId}/results:
    post:
      operationId: submitCompetitionResults
      tags: [Competitions]
      summary: Send the current user's full results snapshot
      description: >-
        Accepted from the start of the competition until dateTo plus the grace period.
        Always send every boulder the user has tried. Snapshots with a number lower than or
        equal to the stored one are ignored (accepted = false) and the stored state is returned.
        Limited to a few requests per user every 15 seconds.
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCompetitionResultsRequest'
      responses:
        '200':
          description: Stored state of the user after processing the snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionUserStatusDto'
        '400':
          description: Invalid results (unknown or repeated boulder, negative attempts, top with 0 attempts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The user is not registered for the competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Competition not found
        '409':
          description: The competition has not started or is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many submissions, retry in a few seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/competitions/{competitionId}/results/me:
    get:
      operationId: getMyCompetitionStatus
      tags: [Competitions]
      summary: Stored results and points of the current user in a competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The user's stored state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionUserStatusDto'
        '404':
          description: Competition not found or the user is not registered
      security:
        - bearerAuth: []
  /api/competitions/{competitionId}/ranking:
    get:
      operationId: getCompetitionRanking
      tags: [Competitions]
      summary: Full ranking of a competition (admin or gym staff)
      description: >-
        One row per participant, with their section and gender so the frontend can filter it
        into the four groups. Sorted by totalPoints, then flashTops, then totalAttempts.
        A competition shows its complete data once dateTo plus its grace period have passed;
        before that the list is empty.
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ranking list, empty while the competition is in its grace period or running
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionRankingEntryDto'
        '403':
          description: Only admins and the owner of the competition's gym can see the ranking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Competition not found
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
        - gender
      properties:
        email:
          type: string
          format: email
        name:
          maxLength: 255
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
        gender:
          $ref: '#/components/schemas/Gender'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    OAuthRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        idToken:
          type: string
        name:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserDto'
        gymRoles:
          type: array
          description: Gyms where the user is OWNER or SETTER. Empty for regular users.
          items:
            $ref: '#/components/schemas/UserGymRoleDto'
    CurrentUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        gymRoles:
          type: array
          description: Gyms where the user is OWNER or SETTER. Empty for regular users.
          items:
            $ref: '#/components/schemas/UserGymRoleDto'
    GymRole:
      type: string
      enum: [OWNER, SETTER]
      description: >-
        Role inside one gym. OWNER manages the gym and its staff. SETTER manages walls,
        competitions and every boulder of the gym. OWNER can do everything a SETTER can.
    UserGymRoleDto:
      type: object
      properties:
        gymId:
          type: integer
        gymName:
          type: string
        role:
          $ref: '#/components/schemas/GymRole'
    GymStaffDto:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/GymRole'
        assignedAt:
          type: string
          format: date-time
          description: RFC 3339 date-time. Responses are always UTC (Z).
    AddGymStaffRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          description: Email of an existing user
        role:
          $ref: '#/components/schemas/GymRole'
    UserDto:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
        gender:
          nullable: true
          description: Empty for accounts created before gender was required
          allOf:
            - $ref: '#/components/schemas/Gender'
    DeactivatedUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
    GymDto:
      type: object
      properties:
        id:
          type: integer
        logo:
          type: string
          format: byte
          nullable: true
        name:
          type: string
        location:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        createdByAdminId:
          type: integer
        timeZone:
          type: string
          example: Europe/Madrid
          description: IANA time zone of the gym (region id such as Europe/Madrid, not a fixed offset). Competition times are shown in this zone.
        createdDate:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        updatedDate:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
          nullable: true
    CreateGymRequest:
      type: object
      required:
        - name
        - timeZone
      properties:
        name:
          maxLength: 255
          type: string
        timeZone:
          type: string
          example: Europe/Madrid
          description: IANA time zone of the gym (region id such as Europe/Madrid, not a fixed offset). Competition times are shown in this zone.
        location:
          maxLength: 255
          type: string
        description:
          maxLength: 2000
          type: string
        logo:
          type: string
          format: byte
          maxLength: 2097152 # 2 MB
          nullable: true
    UpdateGymRequest:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
        timeZone:
          type: string
          example: Europe/Madrid
          description: Optional. IANA time zone of the gym (region id such as Europe/Madrid, not a fixed offset). Competition times are shown in this zone.
        location:
          maxLength: 255
          type: string
          nullable: true
        description:
          maxLength: 2000
          type: string
          nullable: true
        logo:
          type: string
          format: byte
          maxLength: 2097152 # 2 MB
          nullable: true
          description: New logo. Omit to keep the current one
    WallImageSummary:
      type: object
      properties:
        id:
          type: integer
        gymId:
          type: integer
        wallName:
          type: string
        isActual:
          type: boolean
        mimeType:
          type: string
        widthPx:
          type: integer
          nullable: true
        heightPx:
          type: integer
          nullable: true
        uploadedBy:
          type: integer
        uploadedDate:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        thumbnailUrl:
          type: string
    WallImageDetail:
      allOf:
        - $ref: '#/components/schemas/WallImageSummary'
        - type: object
          properties:
            imageUrl:
              type: string

    WallImageUpdateRequest:
      type: object
      required:
        - wallName
        - gymId
      properties:
        gymId:
          type: integer
          description: Gym the wall belongs to
        image:
          type: string
          format: binary
          description: New wall photo (JPEG, PNG, or WebP). Omit to keep the current one
        wallName:
          type: string
          description: Name of the physical wall

    WallImageUploadRequest:
      type: object
      required:
        - image
        - wallName
      properties:
        image:
          type: string
          format: binary
          description: Wall photo file (JPEG, PNG, or WebP)
        wallName:
          type: string
          description: Name of the physical wall (e.g. "Cave", "Slab Left")

    BoulderDto:
      type: object
      properties:
        id:
          type: integer
        gymId:
          type: integer
        wallImageId:
          type: integer
        creatorId:
          type: integer
        name:
          type: string
        grade:
          type: string
        description:
          type: string
          nullable: true
        createdDate:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        updatedDate:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
          nullable: true
    BoulderResponseDto:
      type: object
      properties:
        id:
          type: integer
        gymId:
          type: integer
        wallImageId:
          type: integer
        creator:
          type: string
        name:
          type: string
        grade:
          type: string
        description:
          type: string
          nullable: true
    BoulderDetailDto:
      allOf:
        - $ref: '#/components/schemas/BoulderResponseDto'
        - type: object
          properties:
            holds:
              type: array
              items:
                $ref: '#/components/schemas/HoldDto'
    CreateBoulderRequest:
      type: object
      required:
        - name
        - grade
        - wallImageId
        - holds
      properties:
        name:
          maxLength: 255
          type: string
        grade:
          maxLength: 10
          type: string
          description: Fontainebleau grade (e.g. 6A+, 7B)
        description:
          maxLength: 2000
          type: string
        wallImageId:
          type: integer
        holds:
          maxItems: 200
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateHoldRequest'
    UpdateBoulderRequest:
      type: object
      properties:
        name:
          maxLength: 255
          type: string
        grade:
          maxLength: 10
          type: string
        description:
          maxLength: 2000
          type: string
          nullable: true
        wallImageId:
          type: integer
        holds:
          maxItems: 200
          type: array
          items:
            $ref: '#/components/schemas/HoldDto'
    CreateHoldRequest:
      type: object
      required:
        - coordX
        - coordY
        - radiusRatio
      properties:
        coordX:
          type: number
          format: float
          minimum: 0
          maximum: 1
        coordY:
          type: number
          format: float
          minimum: 0
          maximum: 1
        radiusRatio:
          type: number
          format: float
          minimum: 0
          maximum: 1
        color:
          type: integer
    HoldDto:
      type: object
      properties:
        id:
          type: integer
        boulderId:
          type: integer
        coordX:
          type: number
          format: float
          minimum: 0
          maximum: 1
        coordY:
          type: number
          format: float
          minimum: 0
          maximum: 1
        radiusRatio:
          type: number
          format: float
          minimum: 0
          maximum: 1
        color:
          type: integer
          nullable: true
    PageResponse:
      type: object
      properties:
        content:
          type: array
          items: {}
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    GymPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/GymDto'
    WallImagePageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/WallImageSummary'
    BoulderWithUserPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/BoulderResponseDto'
    BoulderPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/BoulderDto'
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
    CompetitionType:
      type: string
      enum: [ALL_OR_NOTHING, X_ATTEMPTS]
    CompetitionSection:
      type: string
      enum: [OPEN, AMATEUR]
    CompetitionStatus:
      type: string
      enum: [UPCOMING, RUNNING, ENDED]
      description: UPCOMING before dateFrom, RUNNING until dateTo, ENDED afterwards
    Gender:
      type: string
      enum: [MAN, WOMAN, OTHER]
    CompetitionRequest:
      type: object
      required:
        - name
        - type
        - dateFrom
        - dateTo
      properties:
        name:
          maxLength: 255
          type: string
        type:
          $ref: '#/components/schemas/CompetitionType'
        dateFrom:
          type: string
          format: date-time
          description: Start of the competition, sent with its offset (converted to UTC)
        dateTo:
          type: string
          format: date-time
          description: End of the competition, sent with its offset (converted to UTC)
        graceMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: Minutes after the end to keep accepting results. Defaults to 5
        basePoints:
          type: integer
          minimum: 0
          nullable: true
          description: X_ATTEMPTS only. Points for a top on the first attempt
        attemptPenalty:
          type: integer
          minimum: 0
          nullable: true
          description: X_ATTEMPTS only. Points subtracted for each extra attempt
        minPoints:
          type: integer
          minimum: 0
          nullable: true
          description: X_ATTEMPTS only. Lowest points a top can give
    CompetitionDto:
      type: object
      properties:
        id:
          type: integer
        gymId:
          type: integer
        name:
          type: string
        type:
          $ref: '#/components/schemas/CompetitionType'
        dateFrom:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        dateTo:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        graceMinutes:
          type: integer
        basePoints:
          type: integer
          nullable: true
        attemptPenalty:
          type: integer
          nullable: true
        minPoints:
          type: integer
          nullable: true
        createdDate:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
    CompetitionAnnouncementDto:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          $ref: '#/components/schemas/CompetitionType'
        dateFrom:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        dateTo:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        status:
          $ref: '#/components/schemas/CompetitionStatus'
        registered:
          type: boolean
          description: Whether the current user is registered
    CompetitionRegistrationRequest:
      type: object
      required:
        - section
      properties:
        section:
          $ref: '#/components/schemas/CompetitionSection'
    CompetitionParticipantDto:
      type: object
      properties:
        id:
          type: integer
        competitionId:
          type: integer
        userId:
          type: integer
        section:
          $ref: '#/components/schemas/CompetitionSection'
        gender:
          $ref: '#/components/schemas/Gender'
        registeredAt:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
    CompetitionBoulderRequest:
      type: object
      required:
        - name
        - grade
        - wallImageId
        - holds
      properties:
        name:
          maxLength: 255
          type: string
        grade:
          maxLength: 10
          type: string
          description: Fontainebleau grade (e.g. 6A+, 7B)
        description:
          maxLength: 2000
          type: string
          nullable: true
        wallImageId:
          type: integer
        points:
          type: integer
          minimum: 0
          nullable: true
          description: Required for ALL_OR_NOTHING competitions, must be empty for X_ATTEMPTS
        holds:
          maxItems: 200
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateHoldRequest'
    CompetitionBoulderDto:
      type: object
      properties:
        id:
          type: integer
        competitionId:
          type: integer
        wallImageId:
          type: integer
        name:
          type: string
        grade:
          type: string
        description:
          type: string
          nullable: true
        points:
          type: integer
          nullable: true
        holds:
          type: array
          items:
            $ref: '#/components/schemas/HoldDto'
    BoulderResultRequest:
      type: object
      required:
        - boulderId
        - attempts
        - topped
      properties:
        boulderId:
          type: integer
        attempts:
          type: integer
          minimum: 0
        topped:
          type: boolean
    SubmitCompetitionResultsRequest:
      type: object
      required:
        - snapshot
        - results
      properties:
        snapshot:
          type: integer
          minimum: 1
          description: Increasing number generated by the frontend for every send
        results:
          type: array
          items:
            $ref: '#/components/schemas/BoulderResultRequest'
    BoulderResultDto:
      type: object
      properties:
        boulderId:
          type: integer
        attempts:
          type: integer
        topped:
          type: boolean
        points:
          type: integer
    CompetitionUserStatusDto:
      type: object
      properties:
        competitionId:
          type: integer
        status:
          $ref: '#/components/schemas/CompetitionStatus'
        dateFrom:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        dateTo:
          type: string
          format: date-time
          description: RFC 3339 date-time. Requests must include an offset or Z (e.g. 2026-11-20T19:00:00+01:00); responses are always UTC (Z).
        resultsOpenUntil:
          type: string
          format: date-time
          description: dateTo plus the grace period; results are rejected after this moment
        section:
          $ref: '#/components/schemas/CompetitionSection'
        lastSnapshot:
          type: integer
        accepted:
          type: boolean
          description: False when the sent snapshot was older than the stored one and was ignored
        totalPoints:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BoulderResultDto'
    CompetitionRankingEntryDto:
      type: object
      required:
        - name
        - section
        - gender
        - totalPoints
        - totalAttempts
        - flashTops
      properties:
        name:
          type: string
        section:
